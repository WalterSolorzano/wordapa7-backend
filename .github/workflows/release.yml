name: Release

# ──────────────────────────────────────────────────────────────────────────
# Workflow de Release con SignPath Foundation (code signing gratis para OSS)
#
# FLUJO:
#   1. Build sin firmar (electron-builder --publish never)
#   2. Si SignPath está configurado → firmar EXE con certificado OV de CA
#   3. Actualizar latest.yml con el nuevo hash del EXE firmado
#   4. Publicar a GitHub Releases (firmado o sin firmar según configuración)
#
# CONFIGURAR SIGNPATH (una sola vez, después de aprobación):
#   1. Aplicar gratis en https://signpath.org/apply (review 1-4 semanas)
#   2. En GitHub > Settings > Secrets > Actions:
#        SIGNPATH_API_TOKEN = <token de SignPath>
#   3. En GitHub > Settings > Variables > Actions:
#        SIGNPATH_ORG_ID = <Organization ID de SignPath>
#   4. En SignPath.io: crear proyecto "wordapa7" con Trusted Build System = GitHub
#
# HASTA QUE SIGNPATH ESTÉ CONFIGURADO:
#   El instalador se publica SIN firmar. SmartScreen mostrará advertencias.
#   Los usuarios pueden bypass: "Más información" > "Ejecutar de todos modos"
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*.*.*'

env:
  SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  SIGNPATH_ORG_ID: ${{ vars.SIGNPATH_ORG_ID }}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install Python dependencies
      run: pip install -r requirements.txt pyinstaller

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    # ── BUILD (sin firmar, sin publicar) ────────────────────────────────
    # Genera en dist-electron-builder/:
    #   - WordAPA7 Setup *.exe   (instalador NSIS)
    #   - latest.yml             (manifest de auto-update)
    #   - *.blockmap              (mapa de descarga diferencial)
    #
    # CSC_LINK="" evita que electron-builder intente firmar con el PFX local.
    # SignPath firmará el EXE después del build.
    - name: Build backend + frontend + Electron (unsigned)
      run: npm run build:backend && npm run build && npx electron-builder --win --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CSC_LINK: ""
        CSC_KEY_PASSWORD: ""

    # ── FIRMAR CON SIGNPATH (si está configurado) ───────────────────────
    # Sube el instalador sin firmar a SignPath, que lo firma con su
    # certificado OV (emitido a "SignPath Foundation") y lo devuelve.
    - name: Upload unsigned installer for SignPath
      id: upload-unsigned
      if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORG_ID != ''
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-installer
        path: dist-electron-builder/WordAPA7 Setup *.exe
        retention-days: 1

    - name: Sign installer with SignPath
      id: signpath
      if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORG_ID != ''
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORG_ID }}
        project-slug: 'wordapa7'
        signing-policy-slug: 'release-signing'
        github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: './signed-installer'

    # ── REEMPLAZAR EXE FIRMADO + ACTUALIZAR latest.yml ──────────────────
    # Después de firmar, el EXE cambia de tamaño y hash. Hay que actualizar
    # latest.yml con el nuevo SHA-512 para que electron-updater verifique
    # correctamente las actualizaciones automáticas.
    # El blockmap se elimina porque quedó stale (fuerza descarga completa
    # en la primera auto-actualización, lo cual es aceptable).
    - name: Replace with signed installer and update latest.yml
      if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORG_ID != ''
      shell: pwsh
      run: |
        # Reemplazar EXE sin firmar con EXE firmado
        $signedExe = Get-ChildItem "./signed-installer/*.exe" | Select-Object -First 1
        $targetExe = Get-ChildItem "dist-electron-builder/WordAPA7 Setup *.exe" | Select-Object -First 1
        Copy-Item $signedExe.FullName -Destination $targetExe.FullName -Force
        Write-Host "Replaced unsigned installer with signed version: $($signedExe.Name)"

        # Recalcular SHA-512 y tamaño para latest.yml
        $bytes = [System.IO.File]::ReadAllBytes($targetExe.FullName)
        $sha512 = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
        $size = $bytes.Length

        $ymlPath = Join-Path "dist-electron-builder" "latest.yml"
        if (Test-Path $ymlPath) {
          $content = Get-Content $ymlPath -Raw
          $content = $content -replace 'sha512: [A-Za-z0-9+/=]+', "sha512: $sha512"
          $content = $content -replace 'size: \d+', "size: $size"
          Set-Content $ymlPath -Value $content -NoNewline
          Write-Host "Updated latest.yml — sha512=$($sha512.Substring(0,20))... size=$size"
        }

        # Eliminar blockmap stale (auto-updater usará descarga completa)
        Remove-Item "dist-electron-builder/*.blockmap" -Force -ErrorAction SilentlyContinue
        Write-Host "Removed stale blockmap"

    # ── PUBLICAR A GITHUB RELEASES ─────────────────────────────────────
    # Publica el instalador (firmado o sin firmar) + latest.yml + blockmap.
    # Se usa softprops/action-gh-release en lugar de electron-builder --publish
    # para tener control sobre qué archivos se suben (especialmente el EXE
    # firmado por SignPath que reemplaza al original sin firmar).
    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist-electron-builder/WordAPA7 Setup *.exe
          dist-electron-builder/latest.yml
          dist-electron-builder/*.blockmap
        generate_release_notes: true
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
