name: Deploy Azure

on:
  # Solo deploy EXPLICITO, nunca automatico por commit:
  # 1) Boton/accion manual (workflow_dispatch), o
  # 2) Tag reservado "web-*" (git tag web-v1 && git push origin web-v1)
  workflow_dispatch:
  push:
    tags:
      - 'web-*'

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-azure
    steps:
      - uses: actions/checkout@v4

      - name: Compute image owner (lowercase)
        id: owner
        run: echo "IMG_OWNER=${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/azure/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.IMG_OWNER }}/wordapa7:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.IMG_OWNER }}/wordapa7:cache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.IMG_OWNER }}/wordapa7:cache,mode=max

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container App
        run: |
          set -e
          APP="${{ secrets.AZURE_CONTAINER_APP }}"
          RG="${{ secrets.AZURE_RESOURCE_GROUP }}"
          ENV="${{ secrets.AZURE_CONTAINER_ENV }}"
          IMG="ghcr.io/${{ steps.owner.outputs.IMG_OWNER }}/wordapa7:latest"
          if az containerapp show -n "$APP" -g "$RG" --query name -o tsv 2>/dev/null | grep -q .; then
            az containerapp update -n "$APP" -g "$RG" --image "$IMG" \
              --min-replicas 0 --max-replicas 3 \
              --set-env-vars PORT=7860 WORDAPA7_STORAGE_DIR=/data --yes
          else
            az containerapp create -n "$APP" -g "$RG" --environment "$ENV" \
              --image "$IMG" --target-port 7860 --ingress external \
              --min-replicas 0 --max-replicas 3 \
              --env-vars PORT=7860 WORDAPA7_STORAGE_DIR=/data
          fi
          echo "FQDN=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
